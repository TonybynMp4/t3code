name: Mirror patch apply check

on:
  pull_request:
    paths:
      - mirror-patches/**
      - .github/scripts/apply-mirror-patches.sh
      - .github/workflows/mirror-linux-build.yml
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream tag to verify, or leave empty for stable and nightly"
        required: false
        type: string

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve target tags
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      tags: ${{ steps.tags.outputs.tags }}
    steps:
      - name: Resolve target tags
        id: tags
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [[ -n "$INPUT_TAG" ]]; then
            printf 'tags=[{"channel":"requested","tag":"%s"}]\n' "$INPUT_TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mapfile -t refs < <(
            git ls-remote --refs --tags https://github.com/pingdotgg/t3code 'v[0-9]*' \
              | awk '{print $2}' \
              | sed 's#refs/tags/##'
          )
          stable_tag="$(printf '%s\n' "${refs[@]}" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)"
          nightly_tag="$(printf '%s\n' "${refs[@]}" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-nightly\.[0-9.]+$' | sort -V | tail -n1 || true)"

          entries=()
          [[ -n "$stable_tag" ]] && entries+=("{\"channel\":\"stable\",\"tag\":\"$stable_tag\"}")
          [[ -n "$nightly_tag" ]] && entries+=("{\"channel\":\"nightly\",\"tag\":\"$nightly_tag\"}")
          [[ "${#entries[@]}" -gt 0 ]] || { echo "No upstream release tags found." >&2; exit 1; }
          printf 'tags=[%s]\n' "$(IFS=,; echo "${entries[*]}")" >> "$GITHUB_OUTPUT"

  check:
    name: Check mirror patches apply (${{ matrix.channel }})
    needs: resolve
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.resolve.outputs.tags) }}
    steps:
      - name: Checkout upstream tag
        uses: actions/checkout@v6
        with:
          ref: ${{ matrix.tag }}

      - name: Apply mirror patches
        shell: bash
        env:
          MIRROR_REF: ${{ github.ref }}
        run: |
          set -euo pipefail

          git fetch --no-tags --depth=1 origin "$MIRROR_REF"
          git checkout FETCH_HEAD -- \
            mirror-patches \
            .github/scripts/apply-mirror-patches.sh
          .github/scripts/apply-mirror-patches.sh --check
