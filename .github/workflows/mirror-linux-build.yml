name: Mirror Linux build

# Builds .deb and .rpm for x64 and arm64 from an upstream tag and publishes
# them as a release on this fork. Upstream's own release workflow ships Linux
# only as an AppImage, so this fills in the distro packages upstream never builds
# without touching any upstream file. Upstream now ships a self-updating .deb,
# so these builds point the in-app updater at upstream's releases: a .deb
# install updates once more from here, then moves onto the official .deb.
#
# Every step here mirrors the Linux matrix entries of upstream's
# .github/workflows/release.yml. When those gain a dependency, this
# workflow needs the same one. See MIRROR.md.

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream tag to build, for example v0.0.40 or v0.0.41-nightly.20260909.1461"
        required: true
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: mirror-linux-build-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  # The fork's patches (see mirror-patches/README.md) are applied to upstream's
  # source at build time. Checking them here first means a patch that has
  # gone stale costs one two-minute job instead of four long ones, and gives
  # a single place to file an issue about it.
  preflight:
    name: Check patches apply
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    outputs:
      release_exists: ${{ steps.release.outputs.exists }}
    steps:
      # Cheap short-circuit: if this tag already has a release here, the build
      # matrix is skipped (see build.if) and there is no point checking patches.
      - name: Check whether this tag is already released
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout upstream tag
        if: steps.release.outputs.exists != 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - name: Check patches apply
        id: patches
        if: steps.release.outputs.exists != 'true'
        shell: bash
        env:
          MIRROR_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          # The checkout above is upstream's tree at the tag, which contains
          # none of this fork's files. Bring mirror-patches/ and the script
          # that applies them in from this fork's ref. That fetch also lands
          # each patch's pre-image blob in the object database, which is what
          # `git apply --3way` needs to merge around upstream's edits.
          # (mirror-patches/, not patches/ - that name is upstream's, for pnpm
          # patchedDependencies, and clobbering it breaks `vp install`.)
          git fetch --no-tags --depth=1 origin "$MIRROR_REF"
          # Named paths, not the whole .github/scripts directory: upstream
          # has scripts of its own there and the build should use the tag's
          # copies of those, not main's.
          git checkout FETCH_HEAD -- \
            mirror-patches \
            .github/scripts/apply-mirror-patches.sh \
            .github/scripts/report-stale-patch.sh
          .github/scripts/apply-mirror-patches.sh --check

      - name: File an issue about the stale patch
        if: failure() && steps.patches.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: .github/scripts/report-stale-patch.sh

  build:
    name: ${{ matrix.target }} ${{ matrix.arch }}
    needs: [preflight]
    # Skip the whole four-runner matrix when this tag is already released. The
    # scheduled sync keeps selecting a tag until a release exists, but the
    # release lands only in publish at the ~90-minute mark, so the next sync
    # would otherwise rebuild everything just to re-upload identical assets.
    if: needs.preflight.outputs.release_exists != 'true'
    runs-on: ${{ matrix.runner }}
    # This job runs unmodified upstream build scripts from an unreviewed tag.
    # Give it read-only scope: artifact upload uses the runtime token, not
    # GITHUB_TOKEN's scopes, and nothing here should push refs or touch releases.
    permissions:
      contents: read
    # Stock GitHub runners have 4 vCPUs against upstream's 32, and the Rust
    # helpers dominate a cold build.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # Only the distro packages upstream never ships: .deb and .rpm, x64
          # and arm64. Upstream already provides an AppImage, so this fork does
          # not rebuild one.
          - target: deb
            arch: x64
            runner: ubuntu-26.04
            rust_target: x86_64-unknown-linux-gnu
          - target: deb
            arch: arm64
            runner: ubuntu-26.04-arm
            rust_target: aarch64-unknown-linux-gnu
          - target: rpm
            arch: x64
            runner: ubuntu-26.04
            rust_target: x86_64-unknown-linux-gnu
          - target: rpm
            arch: arm64
            runner: ubuntu-26.04-arm
            rust_target: aarch64-unknown-linux-gnu
    env:
      # Upstream publishes a .deb that updates itself, so the update feed is
      # upstream's, not this fork's. A .deb install that updates to this build
      # then takes its next update from pingdotgg/t3code, replacing this
      # package in place (same `t3code` package name). Upstream ships no .rpm,
      # and without the old deb/rpm updater patch the .rpm build reports
      # updates as unavailable instead of polling a feed with nothing for it.
      T3CODE_DESKTOP_UPDATE_REPOSITORY: pingdotgg/t3code
      # Upstream's public T3 Connect config, as baked into its own release
      # builds. Without it cloud sign-in and T3 Connect are compiled out.
      T3CODE_CLERK_PUBLISHABLE_KEY: pk_live_Y2xlcmsudDMuY29kZXMk
      T3CODE_CLERK_JWT_TEMPLATE: t3-relay
      T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: hzxSgY2cH10sDU2r
      T3CODE_RELAY_URL: https://relay.t3.codes
    steps:
      - name: Checkout upstream tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      # Preflight already proved these apply, so a failure here is a runner
      # or fetch problem rather than a stale patch.
      - name: Apply mirror patches
        shell: bash
        env:
          MIRROR_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          # The checkout above is upstream's tree at the tag, which contains
          # none of this fork's files. Bring mirror-patches/ and the script
          # that applies them in from this fork's ref. That fetch also lands
          # each patch's pre-image blob in the object database, which is what
          # `git apply --3way` needs to merge around upstream's edits.
          # (mirror-patches/, not patches/ - that name is upstream's, for pnpm
          # patchedDependencies, and clobbering it breaks `vp install`.)
          git fetch --no-tags --depth=1 origin "$MIRROR_REF"
          # Named paths, not the whole .github/scripts directory: upstream
          # has scripts of its own there and the build should use the tag's
          # copies of those, not main's.
          git checkout FETCH_HEAD -- \
            mirror-patches \
            .github/scripts/apply-mirror-patches.sh \
            .github/scripts/report-stale-patch.sh
          .github/scripts/apply-mirror-patches.sh

      - name: Resolve build version
        id: version
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="$TAG"
          version="${tag#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Not a release tag: $tag" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install desktop dependencies
        run: vp install --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - name: Cache resource monitor
        id: resource_monitor_cache
        uses: actions/cache@v6
        with:
          path: native/resource-monitor/target/${{ matrix.rust_target }}/release/t3-resource-monitor
          key: resource-monitor-${{ matrix.rust_target }}-${{ hashFiles('native/resource-monitor/Cargo.lock', 'native/resource-monitor/Cargo.toml', 'native/resource-monitor/src/**') }}

      - name: Cache Linux capture helpers
        id: capture_helper_cache
        uses: actions/cache@v6
        with:
          path: |
            native/kde-snap-shot/target/${{ matrix.rust_target }}/release/t3-kde-snap-shot
            native/hyprland-snap-shot/target/${{ matrix.rust_target }}/release/t3-hyprland-snap-shot
          key: linux-capture-helpers-${{ matrix.rust_target }}-${{ hashFiles('native/kde-snap-shot/Cargo.lock', 'native/kde-snap-shot/Cargo.toml', 'native/kde-snap-shot/src/**', 'native/hyprland-snap-shot/Cargo.lock', 'native/hyprland-snap-shot/Cargo.toml', 'native/hyprland-snap-shot/src/**', 'native/hyprland-snap-shot/protocols/**') }}

      - name: Setup Rust
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true' || steps.capture_helper_cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install build libraries
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          # libsecret/pkg-config build the browser secret helper; imagemagick
          # resizes the hicolor icon set. Both come straight from upstream's
          # Linux job. fakeroot and rpm are what fpm shells out to for the
          # two package formats.
          sudo apt-get install -y libsecret-1-dev pkg-config imagemagick fakeroot rpm

      # electron-builder downloads a prebuilt fpm for x86_64 Linux only. On
      # arm64 there is no prebuilt to fetch, so install fpm from RubyGems and
      # tell electron-builder to use it instead of looking for a download.
      - name: Install system fpm (arm64)
        if: matrix.arch == 'arm64'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y ruby ruby-dev build-essential
          sudo gem install --no-document fpm
          echo "USE_SYSTEM_FPM=true" >> "$GITHUB_ENV"

      - name: Align package versions to release version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/update-release-package-versions.ts "$VERSION"

      - name: Build desktop artifact
        shell: bash
        env:
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: ${{ steps.resource_monitor_cache.outputs.cache-hit == 'true' }}
          T3CODE_DESKTOP_REUSE_LINUX_CAPTURE_HELPERS: ${{ steps.capture_helper_cache.outputs.cache-hit == 'true' }}
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          vp run dist:desktop:artifact \
            --platform linux \
            --target "$TARGET" \
            --arch "$ARCH" \
            --build-version "$VERSION" \
            --verbose

      - name: Collect release assets
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p release-publish/manifests
          shopt -s nullglob

          patterns=(release/*.deb release/*.rpm)

          found=0
          for file in "${patterns[@]}"; do
            cp "$file" release-publish/
            found=1
          done
          if [[ "$found" -eq 0 ]]; then
            echo "electron-builder produced no $TARGET package." >&2
            ls -la release || true
            exit 1
          fi

          manifests=(release/*-linux*.yml)
          if [[ "${#manifests[@]}" -eq 0 ]]; then
            echo "No update manifest for $TARGET; auto-update would silently report being up to date." >&2
            ls -la release || true
            exit 1
          fi
          for manifest in "${manifests[@]}"; do
            cp "$manifest" "release-publish/manifests/$TARGET-$(basename "$manifest")"
          done

          ls -laR release-publish

      # The tag belongs in the name because mirror-sync calls this workflow
      # twice (stable and nightly) from one parent run, and a reusable workflow
      # shares its caller's artifact namespace. Without it both trains upload
      # "linux-deb-x64" into the same namespace and each publish job downloads
      # whichever package landed there first.
      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: linux-${{ inputs.tag }}-${{ matrix.target }}-${{ matrix.arch }}
          path: release-publish/**
          if-no-files-found: error

  # Installs each package into a clean distro image, so a missing dependency,
  # a package of the wrong format, or a build without the updater marker fails
  # here instead of on a user's machine.
  install:
    name: Install ${{ matrix.target }} ${{ matrix.arch }}
    needs: [build]
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: deb, arch: x64, runner: ubuntu-26.04, image: "debian:13" }
          - { target: deb, arch: arm64, runner: ubuntu-26.04-arm, image: "debian:13" }
          - { target: rpm, arch: x64, runner: ubuntu-26.04, image: "fedora:43" }
          - { target: rpm, arch: arm64, runner: ubuntu-26.04-arm, image: "fedora:43" }
    steps:
      - name: Download package
        uses: actions/download-artifact@v8
        with:
          name: linux-${{ inputs.tag }}-${{ matrix.target }}-${{ matrix.arch }}
          path: package

      - name: Install and inspect
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          packages=(package/*."$TARGET")
          if [[ "${#packages[@]}" -ne 1 ]]; then
            echo "Expected one .$TARGET, found: ${packages[*]}" >&2
            exit 1
          fi
          if [[ "$TARGET" == deb ]]; then
            apt-get update
            apt-get install -y "./${packages[0]}"
            files=$(dpkg -L t3code)
          else
            dnf install -y "./${packages[0]}"
            files=$(rpm -ql t3code)
          fi
          binary=$(grep '^/opt/.*/t3code$' <<<"$files")
          dir=$(dirname "$binary")
          if [[ "$(cat "$dir/resources/package-type")" != "$TARGET" ]]; then
            echo "resources/package-type is not $TARGET; in-app updates would be disabled." >&2
            exit 1
          fi
          if ldd "$binary" | grep 'not found'; then
            echo "Package dependencies do not cover the libraries above." >&2
            exit 1
          fi

  publish:
    name: Publish release
    needs: [build, install]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Full history (without blobs) so the release notes can list this fork's
      # own commits since the previous release.
      - name: Checkout mirror tooling
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github/scripts
          fetch-depth: 0
          filter: blob:none

      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          pattern: linux-${{ inputs.tag }}-*
          merge-multiple: true
          path: release-assets

      - name: Merge update manifests
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          python3 .github/scripts/merge-linux-update-manifests.py release-assets "${TAG#v}"
          rm -rf release-assets/manifests
          ls -la release-assets

      - name: Publish to this fork's releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          # gh release create would otherwise invent the tag from the default
          # branch, attaching packages to the wrong commit. Mirror Upstream
          # pushes upstream tags here; a miss means it has not run yet.
          if ! git ls-remote --exit-code --tags \
            "https://github.com/$GITHUB_REPOSITORY" "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG is not mirrored into $GITHUB_REPOSITORY yet. Run the Mirror upstream workflow first." >&2
            exit 1
          fi

          channel_of() {
            case "$1" in
              *-nightly.*) echo nightly ;;
              *-preview.*) echo preview ;;
              *-*) echo prerelease ;;
              *) echo stable ;;
            esac
          }
          channel="$(channel_of "$TAG")"
          case "$channel" in
            stable)
              channel_args=(--latest)
              channel_note="an upstream **stable release**"
              ;;
            *)
              channel_args=(--prerelease --latest=false)
              channel_note="an upstream **$channel**"
              ;;
          esac

          # This fork's own changes since the previous release on the same
          # channel, so each change is announced once per channel. Upstream
          # arrives only through merge commits, so first-parent non-merge
          # commits are exactly this fork's. Each release records the main
          # commit it was published from; releases older than that marker fall
          # back to their publish time. With no previous release there is no
          # meaningful range, so the section is left out.
          mirror_sha="$(git rev-parse HEAD)"
          previous_tag=""
          previous_published=""
          while IFS=$'\t' read -r tag published; do
            if [ "$tag" != "$TAG" ] && [ "$(channel_of "$tag")" = "$channel" ]; then
              previous_tag="$tag"
              previous_published="$published"
              break
            fi
          done < <(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 100 \
            --json tagName,publishedAt --jq 'sort_by(.publishedAt) | reverse | .[] | [.tagName, .publishedAt] | @tsv')

          mirror_changes=""
          if [ -n "$previous_tag" ]; then
            previous_sha="$(gh release view "$previous_tag" --repo "$GITHUB_REPOSITORY" --json body --jq '.body' \
              | grep -oE 'mirror-main: [0-9a-f]{40}' | head -1 | cut -d' ' -f2 || true)"
            if [ -n "$previous_sha" ] && git cat-file -e "$previous_sha^{commit}" 2>/dev/null; then
              range=("$previous_sha..HEAD")
            else
              range=(--since="$previous_published" HEAD)
            fi
            mirror_changes="$(git log --first-parent --no-merges --format="* %s ([%h](https://github.com/$GITHUB_REPOSITORY/commit/%H))" "${range[@]}")"
          fi

          # Best-effort: upstream's own release body, folded in below so this
          # release's changelog is not a second page to check. Absent (for
          # example a tag upstream hasn't released yet) just drops the section.
          # The same response carries upstream's publish time, which is the only
          # way to know how far behind them this build landed.
          if gh api "repos/pingdotgg/t3code/releases/tags/$TAG" > upstream-release.json 2>/dev/null; then
            jq -r '.body // ""' upstream-release.json > upstream-notes.md
            upstream_published="$(jq -r '.published_at // .created_at // ""' upstream-release.json)"
          else
            : > upstream-notes.md
            upstream_published=""
          fi

          # Stamped into the body so the in-app changelog can date each release
          # without calling the GitHub API; the popup parses the visible
          # "Published <ISO>" line below. It cannot be an HTML comment: the app
          # reads notes from the releases.atom feed, whose rendered HTML drops
          # comments. gh publishes within seconds of this, so it doubles as the
          # release time for the delay stat.
          published_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          format_duration() {
            local total="$1" days hours minutes
            days=$((total / 86400))
            hours=$((total % 86400 / 3600))
            minutes=$((total % 3600 / 60))
            if [ "$days" -gt 0 ]; then
              printf '%dd %dh %dm' "$days" "$hours" "$minutes"
            elif [ "$hours" -gt 0 ]; then
              printf '%dh %dm' "$hours" "$minutes"
            else
              printf '%dm' "$minutes"
            fi
          }

          mirror_delay=""
          delay_seconds=""
          if [ -n "$upstream_published" ]; then
            delay_seconds=$(( $(date -u -d "$published_at" +%s) - $(date -u -d "$upstream_published" +%s) ))
            if [ "$delay_seconds" -ge 0 ]; then
              mirror_delay="$(format_duration "$delay_seconds")"
            else
              delay_seconds=""
            fi
          fi

          # Machine-readable copy of the same numbers, for dashboards that list
          # this fork's releases through the GitHub API and parse the body.
          # One JSON object on one line; nulls when upstream has no release.
          mirror_stats="$(jq -nc \
            --arg tag "$TAG" \
            --arg channel "$channel" \
            --arg publishedAt "$published_at" \
            --arg upstreamPublishedAt "$upstream_published" \
            --arg delaySeconds "$delay_seconds" \
            '{
              version: 1,
              tag: $tag,
              channel: $channel,
              publishedAt: $publishedAt,
              upstreamPublishedAt: (if $upstreamPublishedAt == "" then null else $upstreamPublishedAt end),
              delaySeconds: (if $delaySeconds == "" then null else ($delaySeconds | tonumber) end)
            }')"

          # Body layout is tuned for the desktop update popup, which parses this
          # text: it collects the list items above the first "Full Changelog" /
          # "New Contributors" heading, keeps the last few, and reverses them
          # (apps/desktop/src/updates/releaseNotes.ts). So the upstream changelog
          # goes first, then this fork's own changes, inserted before upstream's
          # "## New Contributors" heading so the parser still reaches them. The
          # mirror-release-changelog patch lists items under the "Linux build
          # changes" heading separately, so keep that heading text in sync with
          # its MIRROR_SECTION_HEADING. Boilerplate goes under the "## Full
          # Changelog" heading, which stops that parser and keeps it out of the
          # popup. The warning heading at the very top is a heading, which the
          # parser skips, so it still leads the GitHub page without polluting
          # the popup. Upstream's own "Full Changelog:" line is pulled out and
          # re-emitted as that heading's link so the compare URL is not
          # duplicated.
          compare_url="$(grep -oiE 'https://github.com/[^ )]+/compare/[^ )]+' upstream-notes.md | head -1 || true)"
          upstream_body="$(grep -viE '^[*_ ]*full changelog[*_ ]*:' upstream-notes.md || true)"

          mirror_section=""
          if [ -n "$mirror_changes" ]; then
            mirror_section="$(printf '## Linux build changes\n\n%s\n' "$mirror_changes")"
          fi

          {
            echo "## ⚠️ Unofficial Linux build (\`.deb\` / \`.rpm\`) — not official T3 Code"
            echo
            if grep -q '[^[:space:]]' <<<"$upstream_body"; then
              MIRROR_SECTION="$mirror_section" awk '
                !done && tolower($0) ~ /^#+[[:space:]]*new contributors/ {
                  if (ENVIRON["MIRROR_SECTION"] != "") print ENVIRON["MIRROR_SECTION"] "\n"
                  done = 1
                }
                { print }
                END { if (!done && ENVIRON["MIRROR_SECTION"] != "") print "\n" ENVIRON["MIRROR_SECTION"] }
              ' <<<"$upstream_body"
              echo
            elif [ -n "$mirror_section" ]; then
              printf '%s\n\n' "$mirror_section"
            fi
            echo "## Full Changelog"
            echo
            if [ -n "$compare_url" ]; then
              echo "$compare_url"
              echo
            fi
            echo "---"
            echo
            echo "These are **not** official T3 Code builds. They are produced by this fork from unmodified upstream source at [\`$TAG\`](https://github.com/pingdotgg/t3code/releases/tag/$TAG), because upstream CI ships Linux only as an AppImage. This tag is $channel_note."
            echo
            echo "- Formats: \`.deb\` and \`.rpm\`, x64 and arm64"
            echo "- **This fork is retiring.** Upstream now ships an official self-updating \`.deb\`. A \`.deb\` install that updates to this release takes its next update from the official [pingdotgg/t3code releases](https://github.com/pingdotgg/t3code/releases) and needs nothing else from you."
            echo "- Upstream ships no \`.rpm\`, so \`.rpm\` installs no longer auto-update. Switch to the official AppImage or \`.deb\`."
            echo "- For the AppImage, use the official [pingdotgg/t3code releases](https://github.com/pingdotgg/t3code/releases) - this fork does not rebuild it."
            echo
            echo "For official builds, use [pingdotgg/t3code releases](https://github.com/pingdotgg/t3code/releases)."
            echo
            if [ -n "$mirror_delay" ]; then
              echo "Published $published_at, $mirror_delay after the upstream release ($upstream_published)."
            else
              echo "Published $published_at."
            fi
            echo
            echo "<!-- mirror-main: $mirror_sha -->"
            echo "<!-- mirror-stats: $mirror_stats -->"
          } > release-notes.md

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --notes-file release-notes.md \
              "${channel_args[@]}"

            # Maintainer-facing: how far this fork trails upstream, run over
            # run. Only on first publish; a re-run that re-uploads assets
            # leaves the release's original timestamps in place.
            {
              echo "### Mirror release $TAG"
              echo
              echo "| Stat | Value |"
              echo "| --- | --- |"
              echo "| Upstream published | ${upstream_published:-unknown} |"
              echo "| Mirror published | $published_at |"
              echo "| Delay behind upstream | ${mirror_delay:-unknown} |"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
